name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  evaluator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build evaluator tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          source/evaluator.cpp tests/evaluator_tests.cpp
          -o evaluator_tests
      - name: Run evaluator tests
        run: ./evaluator_tests

  three-ds-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5
      - name: Build 3DS packages
        run: make package
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: CalculaThreeDS-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/CalculaThreeDS.3dsx
            out/CalculaThreeDS.smdh
            out/CalculaThreeDS.cia
