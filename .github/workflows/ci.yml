name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  evaluator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build evaluator tests
        run: >-
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic
          source/evaluator.cpp tests/evaluator_tests.cpp
          -o evaluator_tests
      - name: Run evaluator tests
        run: ./evaluator_tests

  three-ds-build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5
      - name: Install CIA packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends unzip
          curl --fail --location --silent --show-error \
            https://github.com/Epicpkmn11/bannertool/releases/download/v1.2.2/bannertool.zip \
            --output bannertool.zip
          echo "e4259c08fe8944ebadd5f4b96f9a8603e5427338074cfc46323fbbc3410d51ed  bannertool.zip" | sha256sum --check
          curl --fail --location --silent --show-error \
            https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.19.0/makerom-v0.19.0-ubuntu_x86_64.zip \
            --output makerom.zip
          echo "287b809dec064e0ad597e3d272c49ecb7eed41693d5ee6fef9d8a8aa24c2497e  makerom.zip" | sha256sum --check
          unzip -j bannertool.zip linux-x86_64/bannertool -d tools
          unzip -j makerom.zip makerom -d tools
          sudo install -m 0755 tools/bannertool tools/makerom /usr/local/bin/
      - name: Build 3DS packages
        run: make package
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: CalculaThreeDS-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/CalculaThreeDS.3dsx
            out/CalculaThreeDS.smdh
            out/CalculaThreeDS.cia
